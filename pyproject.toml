[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-digital-anneal"
version = "0.1.0"
description = "Digital Annealer-style parallel-trial heuristic solver for Ising and QUBO optimization problems. Quantum-inspired classical optimization, not cryptography."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["digital-annealing", "parallel-trial", "ising", "qubo", "quantum-inspired", "heuristic", "numba"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numba", "numpy", "numpy", "numba"]

[project.optional-dependencies]
test = ["pytest", "numpy", "numba"]

[project.urls]
Homepage = "https://github.com/PQBlocks/digital-annealing"
Documentation = "https://github.com/PQBlocks/digital-annealing#readme"
Source = "https://github.com/PQBlocks/digital-annealing"
Changelog = "https://github.com/PQBlocks/digital-annealing/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/digital-annealing/issues"
Security = "https://github.com/PQBlocks/digital-annealing/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
